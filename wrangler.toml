name = "asvir-makassar"
main = "worker.js"
compatibility_date = "2026-01-01"

# Buat namespace lalu tempel id-nya di sini:
#   npx wrangler kv namespace create SHEET_CACHE
[[kv_namespaces]]
binding = "SHEET_CACHE"
id = "b167303e78c54c6792d1fc6bb94d9b79"

[vars]
ALLOWED_ORIGIN = "https://mkimakassar84-dev.github.io"
# Sempat dicoba naik ke "gemini-3.5-flash" (full) untuk kurangi kasus model mengarang, tapi model
# itu balik error 503 "high demand" terus-menerus saat dicoba (30/7/2026) — dikembalikan ke
# flash-lite yang terbukti stabil supaya MIRA tidak mati total. Coba lagi lain waktu kalau mau.
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Auto-sync setiap 10 menit — supaya KV tidak pernah basi terlalu lama tanpa perlu trigger manual.
[triggers]
crons = ["*/10 * * * *"]

# Secrets (JANGAN ditulis di sini) — set lewat CLI:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put SYNC_TOKEN
