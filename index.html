<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MIRA</title>
<meta name="theme-color" content="#9c2b2e" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.svg" />
<link rel="apple-touch-icon" href="./icon-192.svg" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          victory: { DEFAULT: '#9c2b2e', dark: '#7a1f22' },
          sand: { DEFAULT: '#f1e4c6', border: '#e3d3a6' },
        },
      },
    },
  };
</script>
<style>
  .mic-btn.recording { background-color: #dc2626; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  .mic-btn { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; }
</style>
</head>
<body class="h-screen flex flex-col bg-sand text-gray-800 overflow-hidden">

  <!-- Header -->
  <header class="bg-victory text-sand px-4 py-3 flex items-center justify-between shadow-md shrink-0">
    <div>
      <h1 class="font-bold text-lg leading-tight">MIRA</h1>
      <p id="statusText" class="text-xs text-sand/80">Memuat status data…</p>
    </div>
    <div class="flex items-center gap-3 shrink-0">
      <button
        type="button"
        id="refreshBtn"
        class="w-8 h-8 rounded-full flex items-center justify-center text-sand/90 hover:bg-white/10 transition-colors"
        aria-label="Hapus histori chat"
        title="Hapus histori chat"
      >
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 10-2.64 6.36M21 12v-5M21 12h-5"/></svg>
      </button>
      <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-yellow-400 shrink-0"></span>
    </div>
  </header>

  <!-- Chat area -->
  <main id="chatArea" class="flex-1 overflow-y-auto px-3 py-4 space-y-3">
    <div class="flex justify-start">
      <div class="max-w-[85%] bg-white border border-sand-border rounded-2xl rounded-tl-sm px-4 py-2.5 shadow-sm text-sm">
        Halo! Saya <b>MIRA</b> (Makassar Intelligent Response Assistant). Tanya saya soal apapun di cabang Makassar, bisa ketik atau klik tombol mic untuk bicara. 👋
      </div>
    </div>
  </main>

  <!-- Input -->
  <form id="chatForm" class="shrink-0 border-t border-sand-border bg-white p-3 flex items-end gap-2">
    <button
      type="button"
      id="micBtn"
      class="mic-btn shrink-0 bg-white border border-sand-border text-victory rounded-xl w-11 h-11 flex items-center justify-center transition-colors select-none touch-none"
      aria-label="Ketuk untuk bicara"
      title="Ketuk untuk bicara"
      oncontextmenu="return false"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3z"/><path d="M19 11a1 1 0 00-2 0 5 5 0 01-10 0 1 1 0 00-2 0 7 7 0 006 6.92V20H9a1 1 0 000 2h6a1 1 0 000-2h-2v-2.08A7 7 0 0019 11z"/></svg>
    </button>
    <textarea
      id="messageInput"
      rows="1"
      placeholder="Tulis pertanyaan…"
      class="flex-1 resize-none rounded-xl border border-sand-border px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-victory/40 max-h-32"
    ></textarea>
    <button
      type="submit"
      id="sendBtn"
      class="shrink-0 bg-victory hover:bg-victory-dark text-white rounded-xl w-11 h-11 flex items-center justify-center transition-colors disabled:opacity-40"
      aria-label="Kirim"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor"/></svg>
    </button>
  </form>

<script>
  // ---- Config: ganti sesuai URL Worker yang sudah di-deploy ----
  const API_BASE = 'https://asvir-makassar.mkimakassar84.workers.dev';

  const chatArea = document.getElementById('chatArea');
  const chatForm = document.getElementById('chatForm');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const statusText = document.getElementById('statusText');
  const statusDot = document.getElementById('statusDot');

  const WELCOME_HTML = `
    <div class="flex justify-start">
      <div class="max-w-[85%] bg-white border border-sand-border rounded-2xl rounded-tl-sm px-4 py-2.5 shadow-sm text-sm">
        Halo! Saya <b>MIRA</b> (Makassar Intelligent Response Assistant). Tanya saya soal apapun di cabang Makassar, bisa ketik atau klik tombol mic untuk bicara. 👋
      </div>
    </div>
  `;

  let chatHistory = []; // [{role:'user'|'model', text}], sent to backend so follow-ups work

  function resetChat() {
    stopSpeaking();
    stopRecognition();
    chatHistory = [];
    chatArea.innerHTML = WELCOME_HTML;
  }
  refreshBtn.addEventListener('click', resetChat);

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // Renders **bold**, [markdown](links), and bare URLs as clickable <a> — text is escaped first
  // so nothing from the model's answer can inject raw HTML.
  function linkify(text) {
    let out = escapeHtml(text);
    out = out.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, label, url) => {
      return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="underline text-victory">${label}</a>`;
    });
    out = out.replace(/(?<!href="|>)(https?:\/\/[^\s<]+)/g, (url) => {
      const clean = url.replace(/[),.]+$/, '');
      return `<a href="${clean}" target="_blank" rel="noopener noreferrer" class="underline text-victory break-all">${clean}</a>`;
    });
    return out;
  }

  function scrollToBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function addUserBubble(text) {
    const wrap = document.createElement('div');
    wrap.className = 'flex justify-end';
    wrap.innerHTML = `
      <div class="max-w-[85%] bg-victory text-white rounded-2xl rounded-tr-sm px-4 py-2.5 shadow-sm text-sm whitespace-pre-wrap">${escapeHtml(text)}</div>
    `;
    chatArea.appendChild(wrap);
    scrollToBottom();
  }

  function addAiBubble() {
    const wrap = document.createElement('div');
    wrap.className = 'flex justify-start items-end gap-1.5';
    wrap.innerHTML = `
      <div class="ai-bubble max-w-[85%] bg-white border border-sand-border rounded-2xl rounded-tl-sm px-4 py-2.5 shadow-sm text-sm">
        <div class="ai-text whitespace-pre-wrap"><span class="typing-cursor">▍</span></div>
      </div>
      <button type="button" class="wa-share-btn hidden shrink-0 w-7 h-7 rounded-full bg-white border border-sand-border items-center justify-center text-green-600 hover:bg-green-50" title="Bagikan ke WhatsApp">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.81L2 22l5.42-1.36a9.85 9.85 0 004.62 1.15h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.64-1.03-5.13-2.9-7C17.17 3.03 14.68 2 12.04 2zm0 18.07h-.01a8.2 8.2 0 01-4.18-1.15l-.3-.18-3.12.83.83-3.04-.2-.31a8.19 8.19 0 01-1.26-4.4 8.24 8.24 0 018.24-8.24c2.2 0 4.27.86 5.82 2.42a8.16 8.16 0 012.41 5.82c0 4.55-3.7 8.25-8.23 8.25zm4.52-6.17c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.13-.17.25-.64.81-.78.97-.15.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.44-.06-.12-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31s-.88.86-.88 2.11.9 2.45 1.03 2.62c.13.17 1.77 2.71 4.29 3.79.6.26 1.07.41 1.43.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.1-.23-.17-.48-.29z"/></svg>
      </button>
    `;
    chatArea.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function finalizeAiBubble(bubbleEl, fullText) {
    const textEl = bubbleEl.querySelector('.ai-text');
    textEl.innerHTML = linkify(fullText || '(tidak ada jawaban)');
    const waBtn = bubbleEl.querySelector('.wa-share-btn');
    waBtn.classList.remove('hidden');
    waBtn.classList.add('flex');
    waBtn.addEventListener('click', () => {
      window.open(`https://wa.me/?text=${encodeURIComponent(fullText)}`, '_blank');
    });
    if (fullText) speak(fullText);
  }

  // ==== Text-to-speech with Indonesian pronunciation rules ====
  // - product codes: digits spelled one-by-one ("KSFO108" -> "KSFO 1 0 8"), letter part read
  //   normally (not spelled) UNLESS it's a bare 3-letter capital acronym (OLT, ONT, ONU, ...).
  // - Rupiah figures are left alone so they're read as a normal nominal amount.
  // - markdown/links stripped so the assistant doesn't read out raw syntax or full URLs.
  function toSpeakable(text) {
    let t = text
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '$1')
      .replace(/https?:\/\/\S+/g, '')
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1');

    t = t.replace(/\b(?!Rp\d)([A-Za-z]{2,8})(\d{2,6})\b/g, (m, letters, digits) => `${letters} ${digits.split('').join(' ')}`);
    // Commas (not periods) between spelled-out letters — periods make most TTS engines drop
    // pitch and reset like a new sentence per letter, which is what sounded stiff/robotic.
    t = t.replace(/\b([A-Z]{3})\b(?!\d)/g, (m, letters) => letters.split('').join(', '));
    return t;
  }

  // Auto-pick the best available Indonesian voice (free, browser-native — no extra API calls/
  // latency), preferring a female-sounding one. The Web Speech API has no standard "gender"
  // field, so this is a best-effort name-based heuristic — on devices with only one unlabeled
  // Indonesian system voice, we can't guarantee it's female, there's simply nothing to pick from.
  const FEMALE_VOICE_HINTS = /female|wanita|perempuan|damayanti|siti|dewi|putri|ayu|sari|maya/i;
  const MALE_VOICE_HINTS = /\bmale\b|pria|laki|andika|budi|joko|dermawan/i;
  let indonesianVoice = null;
  function pickIndonesianVoice() {
    const voices = window.speechSynthesis.getVoices();
    const idVoices = voices.filter((v) => v.lang && v.lang.toLowerCase().startsWith('id'));
    if (!idVoices.length) return null;
    const female = idVoices.find((v) => (v.gender && /female/i.test(v.gender)) || FEMALE_VOICE_HINTS.test(v.name));
    if (female) return female;
    const notMale = idVoices.find((v) => !((v.gender && /male/i.test(v.gender)) || MALE_VOICE_HINTS.test(v.name)));
    const google = idVoices.find((v) => /google/i.test(v.name));
    return notMale || google || idVoices[0];
  }
  if ('speechSynthesis' in window) {
    indonesianVoice = pickIndonesianVoice();
    window.speechSynthesis.onvoiceschanged = () => { indonesianVoice = pickIndonesianVoice(); };
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(toSpeakable(text));
    utter.lang = 'id-ID';
    utter.rate = 0.95; // slightly slower than default — less rushed/robotic
    utter.pitch = 1.05; // slightly higher — reads more natural on most Indonesian TTS voices
    if (indonesianVoice) utter.voice = indonesianVoice;
    window.speechSynthesis.speak(utter);
  }

  function stopSpeaking() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }

  chatArea.addEventListener('click', () => stopSpeaking());

  async function sendMessage(message) {
    addUserBubble(message);
    const bubbleEl = addAiBubble();
    const textEl = bubbleEl.querySelector('.ai-text');
    let fullText = '';
    const historyToSend = chatHistory.slice(-10);

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, history: historyToSend }),
      });

      if (!res.ok || !res.body) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.error || `HTTP ${res.status}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        // Gemini's SSE stream uses \r\n line endings; normalize before splitting on blank lines.
        buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');

        const events = buffer.split('\n\n');
        buffer = events.pop(); // last (possibly incomplete) chunk stays in buffer

        for (const evt of events) {
          const line = evt.split('\n').find((l) => l.startsWith('data:'));
          if (!line) continue;
          const jsonStr = line.slice(5).trim();
          if (!jsonStr || jsonStr === '[DONE]') continue;
          try {
            const parsed = JSON.parse(jsonStr);
            const piece = parsed?.candidates?.[0]?.content?.parts?.map((p) => p.text || '').join('') || '';
            if (piece) {
              fullText += piece;
              textEl.innerHTML = linkify(fullText) + '<span class="typing-cursor">▍</span>';
              scrollToBottom();
            }
          } catch { /* ignore partial/non-JSON keepalive lines */ }
        }
      }
    } catch (err) {
      fullText = fullText || `⚠️ Gagal mengambil jawaban: ${err.message}`;
    } finally {
      finalizeAiBubble(bubbleEl, fullText);
      chatHistory.push({ role: 'user', text: message });
      chatHistory.push({ role: 'model', text: fullText });
    }
  }

  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const msg = messageInput.value.trim();
    if (!msg) return;
    messageInput.value = '';
    messageInput.style.height = 'auto';
    stopSpeaking();
    sendMessage(msg);
  });

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      chatForm.requestSubmit();
    }
  });

  messageInput.addEventListener('input', () => {
    messageInput.style.height = 'auto';
    messageInput.style.height = `${messageInput.scrollHeight}px`;
  });

  // ==== Tap-once voice input (Web Speech API, Indonesian) ====
  // Single tap starts listening; recognition auto-stops on its own once it detects the end of
  // speech (browser's built-in silence detection), which fires onresult and auto-sends — no
  // need to hold the button down or press Enter.
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let recognizing = false;

  // Common Indonesian STT misheard words in this app's domain — corrected before sending.
  function correctSpeechTranscript(text) {
    return text.replace(/\bstop\b/gi, 'stok');
  }

  function startRecognition() {
    if (!SpeechRecognitionCtor || recognizing) return;
    stopSpeaking();
    recognition = new SpeechRecognitionCtor();
    recognition.lang = 'id-ID';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (ev) => {
      const raw = ev.results?.[0]?.[0]?.transcript?.trim();
      if (raw) {
        messageInput.value = correctSpeechTranscript(raw);
        chatForm.requestSubmit();
      }
    };
    recognition.onerror = () => { recognizing = false; micBtn.classList.remove('recording'); };
    recognition.onend = () => { recognizing = false; micBtn.classList.remove('recording'); };
    recognizing = true;
    micBtn.classList.add('recording');
    try { recognition.start(); } catch { recognizing = false; micBtn.classList.remove('recording'); }
  }

  function stopRecognition() {
    if (recognition && recognizing) recognition.stop();
  }

  if (!SpeechRecognitionCtor) {
    micBtn.disabled = true;
    micBtn.title = 'Input suara tidak didukung browser ini';
    micBtn.classList.add('opacity-40');
  } else {
    micBtn.addEventListener('click', () => {
      if (recognizing) stopRecognition();
      else startRecognition();
    });
  }

  async function refreshStatus() {
    try {
      const res = await fetch(`${API_BASE}/status`);
      const data = await res.json();
      if (data.lastSync) {
        const d = new Date(data.lastSync);
        statusText.textContent = `Data terkini — sync ${d.toLocaleString('id-ID')}`;
        statusDot.className = 'w-2.5 h-2.5 rounded-full bg-green-400 shrink-0';
      } else {
        statusText.textContent = 'Belum pernah sync — jalankan /sync di server';
        statusDot.className = 'w-2.5 h-2.5 rounded-full bg-yellow-400 shrink-0';
      }
    } catch {
      statusText.textContent = 'Tidak bisa terhubung ke server';
      statusDot.className = 'w-2.5 h-2.5 rounded-full bg-red-400 shrink-0';
    }
  }
  refreshStatus();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>
</body>
</html>
